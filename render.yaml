# Render Blueprint — New + > Blueprint > pick this repo. Render reads this file.
services:
  - type: web
    name: nassau-candy-reallocation
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ADMIN_TOKEN        # enables POST /api/admin/rebuild; copy it from the Render dashboard
        generateValue: true
